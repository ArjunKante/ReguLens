version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lmscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-lmscan}
    ports:
      # Host-side port is configurable (POSTGRES_PORT in .env) so a machine
      # that already has something bound to 5432 doesn't have to silently
      # drift out of sync with .env's DATABASE_URL/POSTGRES_PORT — every
      # host-facing reference to the Postgres port now comes from this one
      # variable instead of two independently-hand-edited literals.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lmscan_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lmscan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lmscan}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-lmscan}
      STORAGE_ROOT: /app/storage
      # Override any host-specific TESSERACT_CMD from .env (e.g. a Windows path) —
      # the container has its own Linux tesseract-ocr installed via apt.
      TESSERACT_CMD: /usr/bin/tesseract
    ports:
      - "8000:8000"
    volumes:
      - lmscan_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.rules.loader &&
             python -m app.services.startup_reconciliation &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  lmscan_pg_data:
  lmscan_storage:
